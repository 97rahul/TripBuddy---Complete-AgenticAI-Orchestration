<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripBuddy AI Travel Planner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.0/jspdf.umd.min.js"></script>
    <style>
      :root {
        --bg: #07111f;
        --bg-2: #0d1b2a;
        --panel: rgba(15, 23, 42, 0.9);
        --panel-soft: rgba(30, 41, 59, 0.78);
        --primary: #67e8f9;
        --primary-strong: #22d3ee;
        --accent: #f472b6;
        --text: #edf6ff;
        --muted: #b7c7dd;
        --success: #34d399;
        --danger: #f87171;
        --border: rgba(148, 163, 184, 0.18);
        --shadow: 0 20px 45px rgba(3, 7, 18, 0.38);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top left, rgba(103,232,249,0.12), transparent 28%),
                    radial-gradient(circle at bottom right, rgba(244,114,182,0.10), transparent 22%),
                    linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 50%, #101827 100%);
        color: var(--text);
      }

      .container {
        max-width: 1220px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 18px;
        align-items: center;
        margin-bottom: 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-badge {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        font-size: 1.4rem;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        color: #04131d;
        font-weight: 700;
        box-shadow: var(--shadow);
      }

      .brand-text h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: -0.05em;
      }

      .brand-text span {
        display: inline-block;
        color: var(--muted);
        margin-top: 4px;
        font-size: 0.9rem;
      }

      .badge {
        border: 1px solid rgba(103, 232, 249, 0.25);
        background: rgba(103, 232, 249, 0.08);
        color: var(--primary);
        padding: 9px 14px;
        border-radius: 999px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 0.76rem;
      }

      .hero-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 24px;
      }

      .chip {
        background: rgba(255,255,255,0.04);
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.82rem;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .panel {
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.8));
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .compose {
        padding: 22px;
      }

      .panel-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }

      .panel-title h2 {
        margin: 0;
        font-size: 1.2rem;
      }

      .meta-label {
        color: var(--muted);
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      textarea {
        width: 100%;
        min-height: 210px;
        resize: vertical;
        border: 1px solid rgba(103, 232, 249, 0.22);
        border-radius: 18px;
        background: rgba(8, 15, 27, 0.8);
        color: var(--text);
        padding: 18px 16px;
        font-size: 1rem;
        line-height: 1.55;
        outline: none;
        transition: border 0.2s ease, box-shadow 0.2s ease;
      }

      textarea:focus {
        border-color: rgba(103, 232, 249, 0.9);
        box-shadow: 0 0 0 4px rgba(103, 232, 249, 0.12);
      }

      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 18px;
        flex-wrap: wrap;
      }

      .status {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .button-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.2s ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
        color: #062233;
      }

      .secondary-btn {
        background: rgba(255,255,255,0.02);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .pdf-btn {
        background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
        color: white;
      }

      .results {
        padding: 22px 22px 14px;
      }

      .results-inner {
        padding: 0 4px 10px;
      }

      .empty-state {
        color: var(--muted);
        background: rgba(255,255,255,0.02);
        border: 1px dashed rgba(148,163,184,0.25);
        border-radius: 16px;
        padding: 18px;
      }

      .widget-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .widget {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 12px;
        min-height: 122px;
      }

      .widget-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .widget-bullet {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--primary);
        box-shadow: 0 0 16px rgba(103,232,249,0.6);
      }

      .widget-bullet.pending {
        background: rgba(148, 163, 184, 0.7);
        box-shadow: none;
      }

      .widget-bullet.done {
        background: var(--success);
        box-shadow: 0 0 16px rgba(52, 211, 153, 0.6);
      }

      .widget-title {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      .widget-status {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text);
      }

      .widget-meta {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.5;
      }

      .spinner {
        width: 12px;
        height: 12px;
        border: 2px solid rgba(103,232,249,0.25);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: inline-block;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .card {
        background: rgba(17, 24, 39, 0.86);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 22px 24px;
        margin-top: 18px;
      }

      .card h3 {
        margin: 0 0 14px 0;
        font-size: 1.2rem;
        color: var(--primary);
      }

      .review-feedback {
        width: 100%;
        min-height: 110px;
        resize: vertical;
        border: 1px solid rgba(103, 232, 249, 0.22);
        border-radius: 12px;
        background: rgba(8, 15, 27, 0.8);
        color: var(--text);
        padding: 14px;
        font: inherit;
        line-height: 1.55;
      }

      .review-feedback:focus {
        border-color: rgba(103, 232, 249, 0.9);
        outline: 3px solid rgba(103, 232, 249, 0.12);
      }

      .answer {
        white-space: pre-wrap;
        font-size: 1.08rem;
        line-height: 1.85;
        color: #eff7ff;
        overflow-wrap: anywhere;
      }

      .answer-rich {
        white-space: normal;
      }

      .answer-rich h4 {
        margin: 22px 0 8px;
        color: var(--primary);
        font-size: 1.15rem;
        line-height: 1.4;
      }

      .answer-rich h4:first-child {
        margin-top: 0;
      }

      .answer-rich p {
        margin: 0 0 12px;
      }

      .answer-rich ul,
      .answer-rich ol {
        margin: 8px 0 16px;
        padding-left: 28px;
      }

      .answer-rich li {
        margin: 6px 0;
        padding-left: 3px;
      }

      .answer-rich strong {
        color: #ffffff;
      }

      .answer-rich a {
        color: var(--primary);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      .answer-table-wrap {
        margin: 14px 0 18px;
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .answer-rich table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.98rem;
        line-height: 1.6;
      }

      .answer-rich th,
      .answer-rich td {
        padding: 10px 12px;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--border);
      }

      .answer-rich th {
        background: rgba(103, 232, 249, 0.1);
        color: var(--primary);
        font-weight: 700;
      }

      .answer-rich tr:last-child td {
        border-bottom: 0;
      }

      .answer-rich blockquote {
        margin: 12px 0;
        padding: 10px 14px;
        border-left: 3px solid var(--primary);
        background: rgba(103, 232, 249, 0.06);
        color: var(--muted);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .pill {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 999px;
        padding: 7px 10px;
        font-size: 0.77rem;
      }

      .success {
        color: var(--success);
        background: rgba(52, 211, 153, 0.08);
        border: 1px solid rgba(52, 211, 153, 0.28);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 10px;
        font-weight: 600;
      }

      .error {
        color: var(--danger);
        background: rgba(248,113,113,0.08);
        border: 1px solid rgba(248,113,113,0.28);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 10px;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div class="brand">
          <div class="brand-badge">✈️</div>
          <div class="brand-text">
            <h1>TripBuddy</h1>
            <span>AI-powered travel planner</span>
          </div>
        </div>
        <span class="badge">Travel smarter</span>
      </div>

      <div class="hero-strip">
        <span class="chip">Flights</span>
        <span class="chip">Hotels</span>
        <span class="chip">Itineraries</span>
        <span class="chip">Budget planning</span>
        <span class="chip">Custom trips</span>
      </div>

      <div class="layout">
        <section class="panel compose">
          <div class="panel-title">
            <h2>Plan your next trip</h2>
            <span class="meta-label">AI assistant</span>
          </div>

          <textarea id="travelInput" placeholder="Example: Plan a 7-day trip to Japan from India with budget-friendly flights and hotels."></textarea>

          <div class="actions">
            <span id="statusText" class="status">Ready to create your custom itinerary.</span>
            <div class="button-row">
              <button type="button" class="secondary-btn" id="clearBtn">Clear</button>
              <button type="button" class="primary-btn" id="submitBtn">Generate Plan</button>
            </div>
          </div>
        </section>

        <aside class="panel results">
          <div class="panel-title">
            <h2>Travel summary</h2>
            <button type="button" class="pdf-btn" id="downloadPdfBtn" disabled>Download PDF</button>
          </div>
          <div class="results-inner" id="resultBox">
            <div class="empty-state">Your itinerary and travel insights will appear here.</div>
          </div>
        </aside>
      </div>
    </div>

    <script>
      const inputField = document.getElementById('travelInput');
      const submitBtn = document.getElementById('submitBtn');
      const clearBtn = document.getElementById('clearBtn');
      const resultBox = document.getElementById('resultBox');
      const statusText = document.getElementById('statusText');
      const downloadPdfBtn = document.getElementById('downloadPdfBtn');
      let currentResult = null;
      let widgetInterval = null;

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderMarkdown(value) {
        const lines = String(value).replace(/\r\n?/g, '\n').split('\n');
        const output = [];
        let paragraph = [];
        let listType = null;

        const formatInline = (text) => escapeHtml(text)
          .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
            '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/__(.+?)__/g, '<strong>$1</strong>')
          .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
          .replace(/`([^`\n]+)`/g, '<code>$1</code>');

        const flushParagraph = () => {
          if (paragraph.length) {
            output.push(`<p>${formatInline(paragraph.join(' '))}</p>`);
            paragraph = [];
          }
        };

        const closeList = () => {
          if (listType) {
            output.push(`</${listType}>`);
            listType = null;
          }
        };

        const isTableDivider = (line) =>
          /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
        const parseTableRow = (line) => line
          .trim()
          .replace(/^\|/, '')
          .replace(/\|$/, '')
          .split('|')
          .map((cell) => cell.trim());

        for (let index = 0; index < lines.length; index += 1) {
          const line = lines[index];
          const heading = line.match(/^\s{0,3}#{1,4}\s+(.+?)\s*#*\s*$/);
          const unorderedItem = line.match(/^\s*[-*+]\s+(.+)$/);
          const orderedItem = line.match(/^\s*\d+[.)]\s+(.+)$/);

          if (line.includes('|') && lines[index + 1] && isTableDivider(lines[index + 1])) {
            flushParagraph();
            closeList();

            const headers = parseTableRow(line);
            index += 2;
            const rows = [];
            while (index < lines.length && lines[index].includes('|') && lines[index].trim()) {
              rows.push(parseTableRow(lines[index]));
              index += 1;
            }
            index -= 1;

            output.push('<div class="answer-table-wrap"><table><thead><tr>');
            output.push(headers.map((cell) => `<th>${formatInline(cell)}</th>`).join(''));
            output.push('</tr></thead><tbody>');
            output.push(rows.map((row) => {
              const cells = headers.map((_, cellIndex) =>
                `<td>${formatInline(row[cellIndex] || '')}</td>`
              ).join('');
              return `<tr>${cells}</tr>`;
            }).join(''));
            output.push('</tbody></table></div>');
            continue;
          }

          if (!line.trim()) {
            flushParagraph();
            closeList();
            continue;
          }

          if (heading) {
            flushParagraph();
            closeList();
            output.push(`<h4>${formatInline(heading[1])}</h4>`);
            continue;
          }

          const quote = line.match(/^\s*>\s?(.*)$/);
          if (quote) {
            flushParagraph();
            closeList();
            output.push(`<blockquote>${formatInline(quote[1])}</blockquote>`);
            continue;
          }

          const item = unorderedItem || orderedItem;
          if (item) {
            flushParagraph();
            const nextListType = unorderedItem ? 'ul' : 'ol';
            if (listType !== nextListType) {
              closeList();
              output.push(`<${nextListType}>`);
              listType = nextListType;
            }
            output.push(`<li>${formatInline(item[1])}</li>`);
            continue;
          }

          closeList();
          paragraph.push(line.trim());
        }

        flushParagraph();
        closeList();
        return output.join('');
      }

      function renderLoadingWidgets() {
        const stages = [
          { title: 'Flights', status: 'Fetching', meta: 'Live flight metadata ⏳' },
          { title: 'Hotels', status: 'Checking', meta: 'Nearby stay options ⏳' },
          { title: 'Weather', status: 'Checking', meta: 'Destination conditions ⏳' },
          { title: 'Itinerary', status: 'Planning', meta: 'Final route generation ⏳' }
        ];

        resultBox.innerHTML = `
          <div class="empty-state">Processing your travel request...</div>
          <div class="widget-grid">
            ${stages.map((stage, index) => `
              <div class="widget" data-stage="${index}">
                <div class="widget-header">
                  <span class="widget-bullet pending"></span>
                  <span class="widget-title">${stage.title}</span>
                </div>
                <div class="widget-status">${stage.status}</div>
                <div class="widget-meta">${stage.meta}</div>
              </div>
            `).join('')}
          </div>
        `;

        const widgets = [...document.querySelectorAll('.widget')];
        let activeIndex = 0;

        widgetInterval = setInterval(() => {
          widgets.forEach((widget, index) => {
            const bullet = widget.querySelector('.widget-bullet');
            const status = widget.querySelector('.widget-status');
            const meta = widget.querySelector('.widget-meta');

            if (index < activeIndex) {
              bullet.classList.remove('pending');
              bullet.classList.add('done');
              status.textContent = 'Fetched';
              meta.textContent = 'Metadata confirmed ✓';
            } else if (index === activeIndex) {
              bullet.classList.remove('done');
              bullet.classList.add('pending');
              const spinner = document.createElement('span');
              spinner.className = 'spinner';
              if (!widget.querySelector('.spinner')) {
                widget.querySelector('.widget-header').appendChild(spinner);
              }
              status.textContent = 'Fetching';
              meta.textContent = `${stages[index].title} information loading...`;
            } else {
              bullet.classList.remove('done');
              bullet.classList.add('pending');
              if (widget.querySelector('.spinner')) {
                widget.querySelector('.spinner').remove();
              }
              status.textContent = 'Pending';
              meta.textContent = 'Waiting...';
            }
          });

          activeIndex = Math.min(activeIndex + 1, widgets.length);
          if (activeIndex >= widgets.length) {
            clearInterval(widgetInterval);
          }
        }, 700);
      }

      function renderResults(data) {
        if (widgetInterval) {
          clearInterval(widgetInterval);
          widgetInterval = null;
        }

        const answer = data.answer || 'No itinerary generated.';
        const flights = data.flight_results || 'No flight data available.';
        const hotels = data.hotel_results || 'No hotel data available.';
        const weather = data.weather_results || 'No weather information available.';
        const budget = data.budget_results || 'No budget assessment available.';
        const itinerary = data.itinerary || 'No itinerary data available.';
        const waitingForApproval = data.requires_approval === true;
        const isBlocked = data.guardrail_allowed === false;
        const statusMessage = waitingForApproval
          ? 'Draft itinerary ready — review it and share feedback before finalizing.'
          : isBlocked
            ? 'This request could not be handled.'
            : 'Trip plan generated successfully.';

        resultBox.innerHTML = `
          <div class="${isBlocked ? 'error' : 'success'}">${escapeHtml(statusMessage)}</div>
          <div class="card">
            <h3>${waitingForApproval ? 'Draft Itinerary' : 'Final Answer'}</h3>
            <div class="answer answer-rich">${renderMarkdown(answer)}</div>
          </div>
          ${waitingForApproval ? `
            <div class="card" id="reviewCard">
              <h3>Review your itinerary</h3>
              <p class="answer">${escapeHtml(data.approval_request || 'Review the draft and approve it, or request changes.')}</p>
              <label for="reviewFeedback" class="meta-label">Feedback or changes</label>
              <textarea
                id="reviewFeedback"
                class="review-feedback"
                placeholder="Optional when approving. If requesting changes, tell us what to revise."
                aria-describedby="reviewHelp"
              ></textarea>
              <p class="widget-meta" id="reviewHelp">Your feedback is sent to the planner when you choose an action below.</p>
              <div class="actions">
                <span class="status">Please review the draft before continuing.</span>
                <div class="button-row">
                  <button type="button" class="secondary-btn" id="requestChangesBtn">Request changes</button>
                  <button type="button" class="primary-btn" id="approveItineraryBtn">Approve itinerary</button>
                </div>
              </div>
            </div>
          ` : ''}
          <div class="card">
            <h3>Flights</h3>
            <div class="answer">${escapeHtml(flights).replace(/\n/g, '<br>')}</div>
          </div>
          <div class="card">
            <h3>Hotels</h3>
            <div class="answer">${escapeHtml(hotels).replace(/\n/g, '<br>')}</div>
          </div>
          <div class="card">
            <h3>Weather</h3>
            <div class="answer">${escapeHtml(weather).replace(/\n/g, '<br>')}</div>
          </div>
          <div class="card">
            <h3>Budget Assessment</h3>
            <div class="answer answer-rich">${renderMarkdown(budget)}</div>
          </div>
          <div class="card">
            <h3>Itinerary</h3>
            <div class="answer answer-rich">${renderMarkdown(itinerary)}</div>
          </div>
          <div class="meta">
            <span class="pill">Thread: ${escapeHtml(data.thread_id || 'N/A')}</span>
            <span class="pill">LLM Calls: ${escapeHtml(data.llm_calls || 0)}</span>
          </div>
        `;

        downloadPdfBtn.disabled = isBlocked;

        if (waitingForApproval) {
          document.getElementById('approveItineraryBtn')
            .addEventListener('click', () => submitApproval(true));
          document.getElementById('requestChangesBtn')
            .addEventListener('click', () => submitApproval(false));
        }
      }

      async function submitApproval(approved) {
        if (!currentResult || !currentResult.thread_id) {
          statusText.textContent = 'The trip review session is missing. Please generate the plan again.';
          return;
        }

        const feedbackField = document.getElementById('reviewFeedback');
        const feedback = feedbackField ? feedbackField.value.trim() : '';
        if (!approved && !feedback) {
          statusText.textContent = 'Please describe the changes you want before submitting feedback.';
          if (feedbackField) feedbackField.focus();
          return;
        }

        const approveButton = document.getElementById('approveItineraryBtn');
        const changesButton = document.getElementById('requestChangesBtn');
        approveButton.disabled = true;
        changesButton.disabled = true;
        statusText.textContent = approved ? 'Finalizing your approved itinerary...' : 'Applying your feedback...';

        try {
          const response = await fetch('/api/travel/approval', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              thread_id: currentResult.thread_id,
              approved,
              feedback
            })
          });
          const data = await response.json();
          if (!response.ok || !data.success) {
            throw new Error(data.error || 'Could not submit your itinerary review.');
          }

          data.user_request = currentResult.user_request;
          currentResult = data;
          renderResults(data);
          statusText.textContent = data.requires_approval
            ? 'The plan still needs your review.'
            : 'Your travel plan has been finalized.';
        } catch (error) {
          approveButton.disabled = false;
          changesButton.disabled = false;
          statusText.textContent = 'Could not submit your review. Please try again.';
          const errorNotice = document.createElement('div');
          errorNotice.className = 'error';
          errorNotice.textContent = error.message;
          const reviewCard = document.getElementById('reviewCard');
          if (reviewCard) reviewCard.prepend(errorNotice);
        }
      }

      async function submitRequest() {
        const message = inputField.value.trim();

        if (!message) {
          statusText.textContent = 'Please enter a trip request first.';
          inputField.focus();
          return;
        }

        if (widgetInterval) clearInterval(widgetInterval);
        currentResult = null;
        statusText.textContent = 'Planning your trip...';
        submitBtn.disabled = true;
        renderLoadingWidgets();
        downloadPdfBtn.disabled = true;

        try {
          const response = await fetch('/api/travel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
          });

          const data = await response.json();

          if (!response.ok || !data.success) {
            throw new Error(data.error || 'Something went wrong while planning the trip.');
          }

          currentResult = data;
          currentResult.user_request = message;
          renderResults(data);
          statusText.textContent = 'Trip plan ready.';
        } catch (error) {
          if (widgetInterval) {
            clearInterval(widgetInterval);
            widgetInterval = null;
          }
          currentResult = null;
          resultBox.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
          statusText.textContent = 'Request failed.';
          downloadPdfBtn.disabled = true;
        } finally {
          submitBtn.disabled = false;
        }
      }

      function downloadPdf() {
        if (!currentResult) {
          statusText.textContent = 'Generate a trip plan before downloading the PDF.';
          return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'mm', format: 'a4' });
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const margin = 18;
        const contentWidth = pageWidth - margin * 2;
        let y = 50;

        doc.setFillColor(7, 17, 31);
        doc.rect(0, 0, pageWidth, 38, 'F');
        doc.setTextColor(103, 232, 249);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(21);
        doc.text('TripBuddy', margin, 17);
        doc.setTextColor(255, 255, 255);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(12);
        doc.text('Your personalized travel plan', margin, 25);
        doc.setTextColor(30, 41, 59);

        const drawPageHeader = () => {
          doc.setFillColor(7, 17, 31);
          doc.rect(0, 0, pageWidth, 18, 'F');
          doc.setTextColor(103, 232, 249);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(11);
          doc.text('TripBuddy  |  Travel Plan', margin, 12);
          doc.setTextColor(30, 41, 59);
          y = 27;
        };

        const ensureSpace = (height) => {
          if (y + height > pageHeight - margin) {
            doc.addPage();
            drawPageHeader();
          }
        };

        const writeText = (text, options = {}) => {
          const {
            fontSize = 10.5,
            bold = false,
            color = [30, 41, 59],
            indent = 0,
            gapAfter = 0,
          } = options;
          const normalized = String(text).replace(/\s+/g, ' ').trim();
          if (!normalized) {
            y += gapAfter;
            return;
          }

          doc.setFont('helvetica', bold ? 'bold' : 'normal');
          doc.setFontSize(fontSize);
          doc.setTextColor(...color);
          const lineHeight = fontSize * 0.48;
          const lines = doc.splitTextToSize(normalized, contentWidth - indent);
          lines.forEach((line) => {
            ensureSpace(lineHeight);
            doc.text(line, margin + indent, y);
            y += lineHeight;
          });
          y += gapAfter;
        };

        const renderTable = (table) => {
          const rows = [...table.querySelectorAll('tr')].map((row) =>
            [...row.querySelectorAll('th, td')].map((cell) => cell.textContent.trim())
          );
          const columnCount = Math.max(1, ...rows.map((row) => row.length));
          const columnWidth = contentWidth / columnCount;
          const cellPadding = 2.5;
          const fontSize = columnCount > 4 ? 8 : 9;
          const lineHeight = fontSize * 0.48;

          rows.forEach((row, rowIndex) => {
            const cellLines = Array.from({ length: columnCount }, (_, columnIndex) =>
              doc.splitTextToSize(
                row[columnIndex] || '',
                columnWidth - cellPadding * 2
              )
            );
            const rowHeight = Math.max(
              9,
              ...cellLines.map((lines) => lines.length * lineHeight + cellPadding * 2)
            );
            ensureSpace(rowHeight);

            if (rowIndex === 0) {
              doc.setFillColor(224, 242, 254);
            } else if (rowIndex % 2 === 0) {
              doc.setFillColor(248, 250, 252);
            } else {
              doc.setFillColor(255, 255, 255);
            }
            doc.setDrawColor(203, 213, 225);
            doc.rect(margin, y - cellPadding, contentWidth, rowHeight, 'FD');

            cellLines.forEach((lines, columnIndex) => {
              const cellX = margin + columnIndex * columnWidth;
              if (columnIndex > 0) {
                doc.line(cellX, y - cellPadding, cellX, y - cellPadding + rowHeight);
              }
              doc.setFont('helvetica', rowIndex === 0 ? 'bold' : 'normal');
              doc.setFontSize(fontSize);
              doc.setTextColor(30, 41, 59);
              lines.forEach((line, lineIndex) => {
                doc.text(
                  line,
                  cellX + cellPadding,
                  y + cellPadding + lineIndex * lineHeight
                );
              });
            });
            y += rowHeight;
          });
          y += 5;
        };

        const renderRichSection = (body) => {
          const parsed = document.createElement('div');
          parsed.innerHTML = renderMarkdown(body);

          [...parsed.children].forEach((element) => {
            const tag = element.tagName.toLowerCase();
            if (tag === 'h4') {
              ensureSpace(13);
              writeText(element.textContent, {
                fontSize: 12,
                bold: true,
                color: [12, 103, 140],
                gapAfter: 1.5,
              });
            } else if (tag === 'p') {
              writeText(element.textContent, { fontSize: 10.5, gapAfter: 3 });
            } else if (tag === 'ul' || tag === 'ol') {
              [...element.children].forEach((item, index) => {
                const prefix = tag === 'ol' ? `${index + 1}. ` : '\u2022 ';
                writeText(`${prefix}${item.textContent}`, {
                  fontSize: 10.5,
                  indent: 3,
                  gapAfter: 1,
                });
              });
              y += 2;
            } else if (tag === 'div' && element.querySelector('table')) {
              renderTable(element.querySelector('table'));
            } else if (tag === 'blockquote') {
              writeText(element.textContent, {
                fontSize: 10,
                indent: 5,
                color: [71, 85, 105],
                gapAfter: 3,
              });
            }
          });
        };

        const sections = [
          ['Your Request', currentResult.user_request || ''],
          ['Trip Summary', currentResult.answer || 'No summary available'],
          ['Flight Information', currentResult.flight_results || 'No flight data available'],
          ['Hotel Suggestions', currentResult.hotel_results || 'No hotel data available'],
          ['Weather Information', currentResult.weather_results || 'No weather information available'],
          ['Budget Assessment', currentResult.budget_results || 'No budget assessment available'],
          ['Day-by-Day Itinerary', currentResult.itinerary || 'No itinerary data available'],
        ];

        sections.forEach(([title, body]) => {
          ensureSpace(20);
          doc.setTextColor(12, 103, 140);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(15);
          doc.text(title, margin, y);
          y += 9;
          renderRichSection(body);
          y += 5;
        });

        const pageCount = doc.internal.getNumberOfPages();
        for (let page = 1; page <= pageCount; page += 1) {
          doc.setPage(page);
          doc.setDrawColor(203, 213, 225);
          doc.line(margin, pageHeight - 12, pageWidth - margin, pageHeight - 12);
          doc.setTextColor(100, 116, 139);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(9);
          doc.text(
            `Generated ${new Date().toLocaleDateString()}  |  Page ${page} of ${pageCount}`,
            margin,
            pageHeight - 7
          );
        }

        doc.save(`tripbuddy-itinerary-${Date.now()}.pdf`);
        statusText.textContent = 'PDF downloaded successfully.';
      }

      submitBtn.addEventListener('click', submitRequest);
      clearBtn.addEventListener('click', () => {
        if (widgetInterval) {
          clearInterval(widgetInterval);
          widgetInterval = null;
        }
        inputField.value = '';
        inputField.focus();
        currentResult = null;
        downloadPdfBtn.disabled = true;
        resultBox.innerHTML = '<div class="empty-state">Your itinerary and travel insights will appear here.</div>';
        statusText.textContent = 'Ready to create your custom itinerary.';
      });

      downloadPdfBtn.addEventListener('click', downloadPdf);

      inputField.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
          submitRequest();
        }
      });
    </script>
  </body>
</html>
